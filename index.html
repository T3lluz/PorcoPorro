<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Linked here rather than imported from main.jsx. An import makes Vite
         inject the CSS with JavaScript in dev, so the first paint is unstyled
         HTML and the whole page reflows once the bundle runs. A link blocks
         rendering until the CSS is in, in dev and in the build alike. -->
    <link rel="stylesheet" href="/src/index.css" />
    <!-- matches --sky-highest, so the phone chrome continues the sky -->
    <meta name="theme-color" content="#1f80de" />

    <title>Susan &amp; Skage - 26. juni 2027</title>
    <meta
      name="description"
      content="Susan og Skage gifter seg 26. juni 2027 i St. Paulus kirke i Oslo, med fest på Vespa og Humla. Her finner du tid og sted, veibeskrivelse og svarskjema."
    />

    <link rel="canonical" href="https://t3lluz.github.io/PorcoRosso/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:title" content="Susan &amp; Skage - 26. juni 2027" />
    <meta
      property="og:description"
      content="Vi gifter oss 26. juni 2027 i St. Paulus kirke i Oslo, og vi vil ha dere der."
    />
    <meta property="og:image" content="https://t3lluz.github.io/PorcoRosso/og-image.jpg" />
    <meta property="og:url" content="https://t3lluz.github.io/PorcoRosso/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Only the faces actually used: Cormorant 300/400/500/600 plus italic
         300/400, Lora 400 plus italic, Zen Maru 500. Keep in step with the font
         tokens and the fallback faces in src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lora:ital,wght@0,400;1,400&family=Zen+Maru+Gothic:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
