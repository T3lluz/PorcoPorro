<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- So a phone's browser chrome continues the sky instead of framing it.
         Matches --sky-highest. -->
    <meta name="theme-color" content="#1f80de" />

    <title>Susan &amp; Skage - 26. juni 2027</title>
    <meta
      name="description"
      content="Susan og Skage gifter seg 26. juni 2027 i St. Paulus kirke i Oslo. Her finner du tid og sted, veibeskrivelse og svarskjema."
    />

    <link rel="canonical" href="https://t3lluz.github.io/PorcoRosso/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:title" content="Susan &amp; Skage - 26. juni 2027" />
    <meta
      property="og:description"
      content="Vi gifter oss 26. juni 2027 i St. Paulus kirke i Oslo, og vi vil ha dere der."
    />

    <meta property="og:url" content="https://t3lluz.github.io/PorcoRosso/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Three families, one per role: Cormorant Garamond for display type, Zen
         Maru Gothic for UI labels, Lora for body. Keep in step with the font
         tokens in src/index.css.

         Cormorant carries 600 and 700 for the two lines that have to carry a
         card on their own: the date on the Hvor pass and the couple in the
         footer. Ask for the weight rather than leaving the browser to smear a
         400 into a fake bold, which on a face this fine looks like a printing
         fault. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
