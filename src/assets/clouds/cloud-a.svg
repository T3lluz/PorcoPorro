<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="320" height="130">
  <!-- Broad cumulus. Painted twice: a flat gradient body, then blurred
       shadow/highlight blobs masked back inside the same silhouette. -->
  <defs>
    <linearGradient id="ca-puff" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="130">
      <stop offset="0"  stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f6fcff"/>
      <stop offset="1"  stop-color="#c8e0f4"/>
    </linearGradient>
    <filter id="ca-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="ca-shape">
      <rect x="20" y="84" width="210" height="34" rx="17"/>
      <rect x="150" y="90" width="156" height="28" rx="14"/>
      <ellipse cx="80"  cy="88" rx="66" ry="34"/>
      <ellipse cx="232" cy="92" rx="74" ry="30"/>
      <ellipse cx="150" cy="66" rx="72" ry="50"/>
      <ellipse cx="98"  cy="58" rx="46" ry="37"/>
      <ellipse cx="214" cy="54" rx="52" ry="41"/>
      <ellipse cx="262" cy="72" rx="42" ry="31"/>
      <ellipse cx="176" cy="40" rx="34" ry="25"/>
      <ellipse cx="44"  cy="96" rx="30" ry="22"/>
    </g>
    <mask id="ca-mask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="360" height="170">
      <use href="#ca-shape" fill="#fff"/>
    </mask>
  </defs>

  <use href="#ca-shape" fill="url(#ca-puff)"/>
  <g mask="url(#ca-mask)">
    <g filter="url(#ca-soft)">
      <ellipse cx="160" cy="132" rx="180" ry="40" fill="#a6cbe8" opacity=".65"/>
      <ellipse cx="132" cy="104" rx="74"  ry="26" fill="#b9d8ef" opacity=".5"/>
      <ellipse cx="252" cy="108" rx="58"  ry="20" fill="#b0d2ec" opacity=".45"/>
      <ellipse cx="118" cy="82"  rx="24"  ry="30" fill="#cde3f5" opacity=".55"/>
      <ellipse cx="150" cy="46"  rx="62"  ry="34" fill="#ffffff"/>
      <ellipse cx="212" cy="36"  rx="42"  ry="26" fill="#ffffff" opacity=".9"/>
      <ellipse cx="88"  cy="48"  rx="36"  ry="24" fill="#ffffff" opacity=".8"/>
    </g>
  </g>
</svg>
