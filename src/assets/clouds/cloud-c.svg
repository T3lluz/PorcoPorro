<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- Long, low, drawn-out bank. Same two-pass build as cloud-a. -->
  <defs>
    <linearGradient id="cc-puff" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0"  stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f6fcff"/>
      <stop offset="1"  stop-color="#c8e0f4"/>
    </linearGradient>
    <filter id="cc-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="cc-shape">
      <rect x="18" y="60" width="240" height="30" rx="15"/>
      <rect x="180" y="66" width="226" height="24" rx="12"/>
      <ellipse cx="92"  cy="64" rx="74" ry="27"/>
      <ellipse cx="222" cy="58" rx="88" ry="33"/>
      <ellipse cx="334" cy="68" rx="70" ry="23"/>
      <ellipse cx="166" cy="44" rx="54" ry="29"/>
      <ellipse cx="272" cy="38" rx="46" ry="27"/>
      <ellipse cx="384" cy="74" rx="30" ry="16"/>
    </g>
    <mask id="cc-mask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="460" height="140">
      <use href="#cc-shape" fill="#fff"/>
    </mask>
  </defs>

  <use href="#cc-shape" fill="url(#cc-puff)"/>
  <g mask="url(#cc-mask)">
    <g filter="url(#cc-soft)">
      <ellipse cx="210" cy="104" rx="240" ry="30" fill="#a6cbe8" opacity=".62"/>
      <ellipse cx="120" cy="80"  rx="80"  ry="18" fill="#bcdaf1" opacity=".5"/>
      <ellipse cx="318" cy="82"  rx="72"  ry="16" fill="#b4d5ee" opacity=".45"/>
      <ellipse cx="196" cy="66"  rx="26"  ry="26" fill="#cde3f5" opacity=".45"/>
      <ellipse cx="222" cy="30"  rx="76"  ry="22" fill="#ffffff"/>
      <ellipse cx="164" cy="30"  rx="46"  ry="18" fill="#ffffff" opacity=".85"/>
      <ellipse cx="94"  cy="50"  rx="52"  ry="16" fill="#ffffff" opacity=".7"/>
    </g>
  </g>
</svg>
